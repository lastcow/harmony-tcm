<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg-ch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f2f5ee"/>
      <stop offset="100%" style="stop-color:#eef2f0"/>
    </linearGradient>
    <linearGradient id="protect-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4c878;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#a3c490;stop-opacity:0.08"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="20" y="20" width="760" height="560" rx="30" ry="30" fill="url(#bg-ch)"/>

  <!-- Decorative background shapes -->
  <circle cx="120" cy="120" r="50" fill="#d4c878" opacity="0.06"/>
  <circle cx="680" cy="480" r="55" fill="#a3c490" opacity="0.06"/>
  <circle cx="660" cy="110" r="40" fill="#8bb0c4" opacity="0.05"/>
  <circle cx="140" cy="470" r="35" fill="#d4a0b0" opacity="0.05"/>

  <!-- Protective dome/aura around child -->
  <ellipse cx="400" cy="330" rx="140" ry="170" fill="url(#protect-glow)"/>
  <ellipse cx="400" cy="330" rx="140" ry="170" fill="none" stroke="#a3c490" stroke-width="1" opacity="0.15"/>
  <ellipse cx="400" cy="330" rx="160" ry="190" fill="none" stroke="#d4c878" stroke-width="0.8" opacity="0.1" stroke-dasharray="5,5"/>

  <!-- Child figure - smaller proportions, round -->
  <!-- Head - larger relative to body (childlike) -->
  <circle cx="400" cy="220" r="45" fill="none" stroke="#7a9b6d" stroke-width="2.5" opacity="0.7"/>

  <!-- Simple happy face -->
  <!-- Eyes - round, curious -->
  <circle cx="385" cy="215" r="4" fill="#7a9b6d" opacity="0.5"/>
  <circle cx="415" cy="215" r="4" fill="#7a9b6d" opacity="0.5"/>
  <!-- Eye sparkle -->
  <circle cx="387" cy="213" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="417" cy="213" r="1.5" fill="white" opacity="0.5"/>
  <!-- Smile -->
  <path d="M388,235 Q400,245 412,235" fill="none" stroke="#7a9b6d" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  <!-- Rosy cheeks -->
  <circle cx="375" cy="228" r="6" fill="#d4a0b0" opacity="0.12"/>
  <circle cx="425" cy="228" r="6" fill="#d4a0b0" opacity="0.12"/>

  <!-- Hair tufts -->
  <path d="M370,180 Q380,168 390,178" fill="none" stroke="#7a9b6d" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M395,175 Q405,162 415,172" fill="none" stroke="#7a9b6d" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Neck -->
  <line x1="400" y1="265" x2="400" y2="280" stroke="#7a9b6d" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Body - small, round -->
  <path d="M400,280 Q395,290 370,298" fill="none" stroke="#7a9b6d" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M400,280 Q405,290 430,298" fill="none" stroke="#7a9b6d" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Arms - short, playful -->
  <path d="M370,298 L345,340 L335,360" fill="none" stroke="#7a9b6d" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M430,298 L455,340 L465,360" fill="none" stroke="#7a9b6d" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Torso -->
  <path d="M380,292 L378,380" fill="none" stroke="#7a9b6d" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M420,292 L422,380" fill="none" stroke="#7a9b6d" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Hips -->
  <path d="M378,380 Q400,390 422,380" fill="none" stroke="#7a9b6d" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Legs - short -->
  <path d="M385,386 L380,440 L378,480" fill="none" stroke="#7a9b6d" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M415,386 L420,440 L422,480" fill="none" stroke="#7a9b6d" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Stars scattered around -->
  <!-- Large star - top right -->
  <path d="M560,150 L565,165 L580,168 L568,178 L572,193 L560,185 L548,193 L552,178 L540,168 L555,165Z" fill="#d4c878" opacity="0.25"/>

  <!-- Medium star - top left -->
  <path d="M230,180 L234,192 L246,194 L237,202 L240,214 L230,208 L220,214 L223,202 L214,194 L226,192Z" fill="#d4c878" opacity="0.2"/>

  <!-- Small star - right -->
  <path d="M600,300 L603,308 L611,310 L605,315 L607,323 L600,319 L593,323 L595,315 L589,310 L597,308Z" fill="#d4c878" opacity="0.2"/>

  <!-- Small star - left -->
  <path d="M195,320 L197,327 L204,328 L199,332 L201,339 L195,336 L189,339 L191,332 L186,328 L193,327Z" fill="#d4c878" opacity="0.18"/>

  <!-- Tiny stars -->
  <path d="M300,120 L302,126 L308,127 L304,130 L305,136 L300,133 L295,136 L296,130 L292,127 L298,126Z" fill="#8bb0c4" opacity="0.2"/>
  <path d="M510,100 L512,105 L517,106 L513,109 L514,114 L510,112 L506,114 L507,109 L503,106 L508,105Z" fill="#d4a0b0" opacity="0.18"/>
  <path d="M650,260 L651,264 L655,265 L652,267 L653,271 L650,269 L647,271 L648,267 L645,265 L649,264Z" fill="#a3c490" opacity="0.2"/>

  <!-- Growth symbols -->
  <!-- Sprout/seedling - left -->
  <line x1="170" y1="400" x2="170" y2="360" stroke="#7a9b6d" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>
  <path d="M170,375 Q155,360 155,345" fill="none" stroke="#7a9b6d" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <path d="M155,345 Q158,355 170,365" fill="#a3c490" opacity="0.25"/>
  <path d="M170,360 Q185,348 188,335" fill="none" stroke="#7a9b6d" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <path d="M188,335 Q183,348 170,355" fill="#a3c490" opacity="0.25"/>

  <!-- Growing plant - right -->
  <line x1="630" y1="420" x2="630" y2="370" stroke="#7a9b6d" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>
  <path d="M630,385 Q615,370 612,358" fill="none" stroke="#7a9b6d" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <path d="M612,358 Q618,368 630,378" fill="#a3c490" opacity="0.25"/>
  <path d="M630,370 Q645,358 648,345" fill="none" stroke="#7a9b6d" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <path d="M648,345 Q643,358 630,365" fill="#8bab78" opacity="0.2"/>
  <!-- Small flower bud -->
  <circle cx="630" cy="365" r="5" fill="#d4a0b0" opacity="0.2"/>
  <circle cx="630" cy="365" r="3" fill="#d4a0b0" opacity="0.25"/>

  <!-- Height measurement marks - growth indicator -->
  <line x1="630" y1="420" x2="640" y2="420" stroke="#d4c878" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
  <line x1="630" y1="400" x2="638" y2="400" stroke="#d4c878" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
  <line x1="630" y1="380" x2="636" y2="380" stroke="#d4c878" stroke-width="1" stroke-linecap="round" opacity="0.3"/>

  <!-- Butterfly - gentle -->
  <path d="M510,210 Q520,195 530,205 Q525,215 510,210Z" fill="#8bb0c4" opacity="0.2"/>
  <path d="M510,210 Q520,225 530,215 Q525,205 510,210Z" fill="#b898c4" opacity="0.18"/>
  <path d="M510,210 Q500,195 490,205 Q495,215 510,210Z" fill="#8bb0c4" opacity="0.18"/>
  <path d="M510,210 Q500,225 490,215 Q495,205 510,210Z" fill="#b898c4" opacity="0.15"/>
  <circle cx="510" cy="210" r="1.5" fill="#7a9b6d" opacity="0.4"/>

  <!-- Rainbow arc - subtle -->
  <path d="M280,490 Q400,440 520,490" fill="none" stroke="#d4a0b0" stroke-width="2" opacity="0.12"/>
  <path d="M285,497 Q400,450 515,497" fill="none" stroke="#d4c878" stroke-width="2" opacity="0.12"/>
  <path d="M290,504 Q400,460 510,504" fill="none" stroke="#a3c490" stroke-width="2" opacity="0.12"/>
  <path d="M295,511 Q400,470 505,511" fill="none" stroke="#8bb0c4" stroke-width="2" opacity="0.12"/>

  <!-- Floating bubbles/circles -->
  <circle cx="300" cy="280" r="8" fill="none" stroke="#8bb0c4" stroke-width="1" opacity="0.18"/>
  <circle cx="320" cy="260" r="5" fill="none" stroke="#a3c490" stroke-width="1" opacity="0.15"/>
  <circle cx="490" cy="290" r="7" fill="none" stroke="#d4c878" stroke-width="1" opacity="0.18"/>
  <circle cx="475" cy="270" r="4" fill="none" stroke="#d4a0b0" stroke-width="1" opacity="0.15"/>

  <!-- Gentle sparkle dots -->
  <circle cx="350" cy="160" r="2" fill="#d4c878" opacity="0.3"/>
  <circle cx="450" cy="150" r="1.5" fill="#d4c878" opacity="0.25"/>
  <circle cx="260" cy="250" r="2" fill="#a3c490" opacity="0.2"/>
  <circle cx="540" cy="260" r="1.5" fill="#8bb0c4" opacity="0.2"/>
  <circle cx="350" cy="420" r="1.5" fill="#d4a0b0" opacity="0.2"/>
  <circle cx="455" cy="430" r="2" fill="#a3c490" opacity="0.2"/>
</svg>