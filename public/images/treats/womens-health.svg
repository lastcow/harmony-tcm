<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg-wh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f2eef5"/>
      <stop offset="100%" style="stop-color:#edf0ea"/>
    </linearGradient>
    <linearGradient id="nurture-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b898c4;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#d4a0b0;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="cycle-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b898c4;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#d4a0b0;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#a3c490;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="20" y="20" width="760" height="560" rx="30" ry="30" fill="url(#bg-wh)"/>

  <!-- Decorative circles -->
  <circle cx="130" cy="130" r="50" fill="#b898c4" opacity="0.06"/>
  <circle cx="670" cy="480" r="55" fill="#d4a0b0" opacity="0.05"/>
  <circle cx="680" cy="120" r="40" fill="#a3c490" opacity="0.06"/>

  <!-- Female figure outline - graceful -->
  <!-- Head -->
  <circle cx="400" cy="135" r="33" fill="none" stroke="#9878a8" stroke-width="2.5" opacity="0.7"/>
  <!-- Hair suggestion -->
  <path d="M370,125 Q368,105 385,100 Q400,98 415,100 Q432,105 430,125" fill="none" stroke="#9878a8" stroke-width="1.5" opacity="0.3"/>
  <!-- Neck -->
  <line x1="400" y1="168" x2="400" y2="192" stroke="#9878a8" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Shoulders - softer -->
  <path d="M400,192 Q396,205 350,215" fill="none" stroke="#9878a8" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M400,192 Q404,205 450,215" fill="none" stroke="#9878a8" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Arms -->
  <path d="M350,215 L330,290 L322,340" fill="none" stroke="#9878a8" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M450,215 L470,290 L478,340" fill="none" stroke="#9878a8" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Torso - feminine curves -->
  <path d="M370,207 Q365,250 368,290 Q370,320 365,360" fill="none" stroke="#9878a8" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M430,207 Q435,250 432,290 Q430,320 435,360" fill="none" stroke="#9878a8" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Waist curve -->
  <path d="M368,290 Q400,285 432,290" fill="none" stroke="#9878a8" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.3"/>
  <!-- Hips -->
  <path d="M365,360 Q400,378 435,360" fill="none" stroke="#9878a8" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Legs -->
  <path d="M378,368 L370,455 L368,535" fill="none" stroke="#9878a8" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M422,368 L430,455 L432,535" fill="none" stroke="#9878a8" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Body nurturing glow -->
  <ellipse cx="400" cy="300" rx="50" ry="75" fill="url(#nurture-glow)"/>

  <!-- Hormonal balance symbol - left side -->
  <!-- Yin-yang inspired circle -->
  <circle cx="190" cy="260" r="38" fill="none" stroke="#b898c4" stroke-width="1.5" opacity="0.4"/>
  <path d="M190,222 Q210,260 190,298" fill="#b898c4" opacity="0.12"/>
  <path d="M190,222 Q170,260 190,298" fill="#d4a0b0" opacity="0.1"/>
  <circle cx="190" cy="242" r="6" fill="#d4a0b0" opacity="0.2"/>
  <circle cx="190" cy="278" r="6" fill="#b898c4" opacity="0.15"/>
  <!-- Balance waves -->
  <path d="M148,250 Q140,260 148,270" fill="none" stroke="#b898c4" stroke-width="1" stroke-linecap="round" opacity="0.25"/>
  <path d="M140,248 Q130,260 140,272" fill="none" stroke="#b898c4" stroke-width="0.8" stroke-linecap="round" opacity="0.2"/>

  <!-- Cycle/moon phases - top -->
  <circle cx="320" cy="65" r="12" fill="#d4a0b0" opacity="0.15" stroke="#d4a0b0" stroke-width="1"/>
  <circle cx="360" cy="55" r="14" fill="#d4a0b0" opacity="0.2" stroke="#d4a0b0" stroke-width="1"/>
  <circle cx="400" cy="52" r="15" fill="#d4a0b0" opacity="0.25" stroke="#d4a0b0" stroke-width="1.2"/>
  <circle cx="440" cy="55" r="14" fill="#d4a0b0" opacity="0.2" stroke="#d4a0b0" stroke-width="1"/>
  <circle cx="480" cy="65" r="12" fill="#d4a0b0" opacity="0.15" stroke="#d4a0b0" stroke-width="1"/>
  <!-- Crescent on partial moons -->
  <circle cx="317" cy="64" r="9" fill="#f2eef5"/>
  <circle cx="483" cy="64" r="9" fill="#f2eef5"/>

  <!-- Reproductive wellness - flower of life element -->
  <circle cx="400" cy="330" r="18" fill="none" stroke="#b898c4" stroke-width="1" opacity="0.25"/>
  <circle cx="400" cy="320" r="18" fill="none" stroke="#d4a0b0" stroke-width="1" opacity="0.2"/>
  <circle cx="392" cy="328" r="18" fill="none" stroke="#a3c490" stroke-width="1" opacity="0.18"/>
  <circle cx="408" cy="328" r="18" fill="none" stroke="#b898c4" stroke-width="1" opacity="0.18"/>

  <!-- Nurturing energy - right side -->
  <!-- Hands cupping energy -->
  <path d="M560,240 Q570,250 575,270 Q578,290 570,310" fill="none" stroke="#9878a8" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <path d="M620,240 Q610,250 605,270 Q602,290 610,310" fill="none" stroke="#9878a8" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <!-- Warm energy between hands -->
  <circle cx="590" cy="272" r="18" fill="#d4a0b0" opacity="0.1"/>
  <circle cx="590" cy="272" r="12" fill="#d4a0b0" opacity="0.12"/>
  <circle cx="590" cy="272" r="6" fill="#d4a0b0" opacity="0.15"/>
  <!-- Sparkle -->
  <path d="M590,265 L591,260 L592,265 L597,266 L592,267 L591,272 L590,267 L585,266Z" fill="#d4b896" opacity="0.3"/>

  <!-- Connection lines -->
  <path d="M228,260 Q290,255 360,270" fill="none" stroke="#b898c4" stroke-width="1" stroke-dasharray="3,4" opacity="0.18"/>
  <path d="M440,275 Q510,260 560,265" fill="none" stroke="#d4a0b0" stroke-width="1" stroke-dasharray="3,4" opacity="0.18"/>

  <!-- Botanical accents -->
  <!-- Left flowers -->
  <circle cx="140" cy="380" r="10" fill="#d4a0b0" opacity="0.15"/>
  <ellipse cx="130" cy="375" rx="7" ry="4" fill="#e0b0b8" opacity="0.2" transform="rotate(-20 130 375)"/>
  <ellipse cx="150" cy="375" rx="7" ry="4" fill="#e0b0b8" opacity="0.2" transform="rotate(20 150 375)"/>
  <ellipse cx="135" cy="388" rx="7" ry="4" fill="#e0b0b8" opacity="0.2" transform="rotate(15 135 388)"/>
  <ellipse cx="148" cy="388" rx="7" ry="4" fill="#e0b0b8" opacity="0.2" transform="rotate(-15 148 388)"/>
  <path d="M140,390 Q138,415 142,440" fill="none" stroke="#8bab78" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>
  <path d="M142,415 Q152,408 160,414" fill="#a3c490" opacity="0.2"/>

  <!-- Right leaves -->
  <path d="M640,350 Q658,338 670,350 Q658,362 640,350Z" fill="#a3c490" opacity="0.25"/>
  <path d="M650,368 Q665,358 675,370 Q662,378 650,368Z" fill="#8bab78" opacity="0.2"/>

  <!-- Small leaf top-left -->
  <path d="M180,170 Q195,158 208,170 Q195,180 180,170Z" fill="#a3c490" opacity="0.2"/>

  <!-- Wellness dots -->
  <circle cx="280" cy="180" r="2" fill="#b898c4" opacity="0.25"/>
  <circle cx="520" cy="170" r="2" fill="#d4a0b0" opacity="0.2"/>
  <circle cx="300" cy="420" r="1.5" fill="#a3c490" opacity="0.2"/>
  <circle cx="510" cy="400" r="2" fill="#b898c4" opacity="0.18"/>
  <circle cx="250" cy="320" r="1.5" fill="#d4a0b0" opacity="0.2"/>
  <circle cx="550" cy="350" r="1.5" fill="#a3c490" opacity="0.18"/>

  <!-- Soft energy rings around figure -->
  <circle cx="400" cy="280" r="65" fill="none" stroke="#b898c4" stroke-width="0.8" opacity="0.1"/>
  <circle cx="400" cy="280" r="85" fill="none" stroke="#d4a0b0" stroke-width="0.8" opacity="0.08"/>

  <!-- Bottom decorative curve -->
  <path d="M200,520 Q300,505 400,515 Q500,525 600,510" fill="none" stroke="#b898c4" stroke-width="1" opacity="0.12"/>
</svg>