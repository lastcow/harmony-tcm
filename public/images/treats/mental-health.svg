<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg-mh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eeeff5"/>
      <stop offset="100%" style="stop-color:#e8f0ed"/>
    </linearGradient>
    <linearGradient id="brain-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a090c4;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#8bb0c4;stop-opacity:0.15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="20" y="20" width="760" height="560" rx="30" ry="30" fill="url(#bg-mh)"/>

  <!-- Decorative circles -->
  <circle cx="680" cy="120" r="50" fill="#a090c4" opacity="0.06"/>
  <circle cx="120" cy="480" r="60" fill="#8bb0c4" opacity="0.06"/>
  <circle cx="650" cy="450" r="40" fill="#a3c490" opacity="0.06"/>

  <!-- Head profile - facing right -->
  <path d="M320,350 Q280,340 270,300 Q260,260 275,230 Q290,195 320,175 Q350,158 385,160 Q420,162 445,180 Q465,198 470,225 Q475,250 465,280 Q458,300 440,320 Q430,335 420,345 L420,380 Q420,400 400,410 L350,410 Q330,400 330,380 L330,350Z" fill="url(#brain-glow)" stroke="#8878a8" stroke-width="2" opacity="0.8"/>

  <!-- Face features -->
  <!-- Eye -->
  <path d="M380,260 Q395,252 410,260" fill="none" stroke="#8878a8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Nose hint -->
  <path d="M435,275 Q445,290 440,305" fill="none" stroke="#8878a8" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <!-- Gentle smile -->
  <path d="M415,330 Q425,340 420,345" fill="none" stroke="#8878a8" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>

  <!-- Brain area with calming waves -->
  <path d="M310,210 Q330,195 350,205 Q365,195 380,210" fill="none" stroke="#9080b8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M305,230 Q325,220 340,228 Q355,218 375,225 Q390,220 405,230" fill="none" stroke="#9080b8" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <path d="M310,250 Q330,240 350,248 Q370,238 390,245 Q400,240 415,250" fill="none" stroke="#8bb0c4" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Brain wave patterns emanating from head -->
  <path d="M290,200 Q270,200 260,190 Q250,185 240,190" fill="none" stroke="#9080b8" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M285,220 Q260,220 245,212 Q235,208 220,215" fill="none" stroke="#8bb0c4" stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>
  <path d="M282,240 Q255,242 238,235 Q225,230 210,238" fill="none" stroke="#8bb0c4" stroke-width="1.2" stroke-linecap="round" opacity="0.2"/>

  <!-- Calming wave patterns - right side -->
  <path d="M480,220 Q500,215 515,225 Q530,218 545,225" fill="none" stroke="#9080b8" stroke-width="1.2" stroke-linecap="round" opacity="0.25"/>
  <path d="M485,240 Q505,232 520,242 Q535,234 555,242" fill="none" stroke="#8bb0c4" stroke-width="1.2" stroke-linecap="round" opacity="0.2"/>
  <path d="M490,260 Q510,252 525,260 Q540,252 560,260" fill="none" stroke="#8bb0c4" stroke-width="1" stroke-linecap="round" opacity="0.18"/>

  <!-- Meditation figure below - small -->
  <circle cx="580" cy="380" r="14" fill="none" stroke="#7a9b6d" stroke-width="1.8" opacity="0.5"/>
  <!-- Seated body -->
  <path d="M580,394 L580,420" fill="none" stroke="#7a9b6d" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  <!-- Crossed legs -->
  <path d="M565,430 Q575,425 580,430 Q585,425 595,430" fill="none" stroke="#7a9b6d" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  <!-- Arms in meditation -->
  <path d="M570,408 Q560,420 565,430" fill="none" stroke="#7a9b6d" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M590,408 Q600,420 595,430" fill="none" stroke="#7a9b6d" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Meditation glow -->
  <circle cx="580" cy="410" r="30" fill="#a3c490" opacity="0.06"/>
  <circle cx="580" cy="410" r="42" fill="#a3c490" opacity="0.04"/>

  <!-- Nature elements - leaves -->
  <path d="M140,280 Q160,260 175,278 Q160,292 140,280Z" fill="#a3c490" opacity="0.3"/>
  <path d="M155,300 Q172,285 185,302 Q170,312 155,300Z" fill="#8bab78" opacity="0.25"/>
  <path d="M140,280 L155,300" stroke="#8bab78" stroke-width="1" stroke-linecap="round" opacity="0.3"/>

  <!-- More leaves top-right -->
  <path d="M600,120 Q618,105 630,120 Q618,132 600,120Z" fill="#a3c490" opacity="0.25"/>
  <path d="M615,140 Q630,128 642,142 Q628,150 615,140Z" fill="#8bab78" opacity="0.2"/>

  <!-- Water element - gentle ripples -->
  <path d="M130,420 Q180,410 230,420 Q280,430 330,418" fill="none" stroke="#8bb0c4" stroke-width="1.5" opacity="0.2"/>
  <path d="M140,440 Q190,430 240,440 Q290,450 340,438" fill="none" stroke="#8bb0c4" stroke-width="1.2" opacity="0.15"/>
  <path d="M150,458 Q200,450 250,458 Q300,465 340,455" fill="none" stroke="#8bb0c4" stroke-width="1" opacity="0.12"/>

  <!-- Peaceful dots/stars -->
  <circle cx="200" cy="160" r="3" fill="#9080b8" opacity="0.25"/>
  <circle cx="520" cy="150" r="2.5" fill="#8bb0c4" opacity="0.25"/>
  <circle cx="180" cy="200" r="2" fill="#a3c490" opacity="0.2"/>
  <circle cx="550" cy="320" r="2.5" fill="#9080b8" opacity="0.2"/>
  <circle cx="650" cy="300" r="2" fill="#a3c490" opacity="0.2"/>
  <circle cx="500" cy="400" r="2" fill="#8bb0c4" opacity="0.18"/>

  <!-- Gentle sparkle/star shapes -->
  <path d="M230,130 L232,125 L234,130 L239,132 L234,134 L232,139 L230,134 L225,132Z" fill="#9080b8" opacity="0.2"/>
  <path d="M640,370 L642,365 L644,370 L649,372 L644,374 L642,379 L640,374 L635,372Z" fill="#8bb0c4" opacity="0.18"/>
  <path d="M500,100 L501.5,96 L503,100 L507,101.5 L503,103 L501.5,107 L500,103 L496,101.5Z" fill="#a3c490" opacity="0.2"/>

  <!-- Inner peace circle emanation from head -->
  <circle cx="370" cy="240" r="70" fill="none" stroke="#9080b8" stroke-width="0.8" opacity="0.12"/>
  <circle cx="370" cy="240" r="90" fill="none" stroke="#8bb0c4" stroke-width="0.8" opacity="0.09"/>
  <circle cx="370" cy="240" r="110" fill="none" stroke="#a3c490" stroke-width="0.8" opacity="0.06"/>

  <!-- Connecting path from head to meditation -->
  <path d="M430,350 Q480,370 545,385" fill="none" stroke="#a3c490" stroke-width="1" stroke-dasharray="3,5" opacity="0.2"/>
</svg>