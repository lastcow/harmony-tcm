<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg-gh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eef4f0"/>
      <stop offset="100%" style="stop-color:#e8f0ed"/>
    </linearGradient>
    <linearGradient id="shield-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a3c490;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#7a9b6d;stop-opacity:0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="20" y="20" width="760" height="560" rx="30" ry="30" fill="url(#bg-gh)"/>

  <!-- Decorative circles -->
  <circle cx="120" cy="130" r="55" fill="#a3c490" opacity="0.08"/>
  <circle cx="680" cy="100" r="45" fill="#8bb0c4" opacity="0.08"/>
  <circle cx="690" cy="490" r="50" fill="#a3c490" opacity="0.06"/>

  <!-- Central human figure -->
  <!-- Head -->
  <circle cx="400" cy="155" r="32" fill="none" stroke="#7a9b6d" stroke-width="2.5" opacity="0.7"/>
  <!-- Neck -->
  <line x1="400" y1="187" x2="400" y2="210" stroke="#7a9b6d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Shoulders -->
  <path d="M400,210 Q395,225 355,235" fill="none" stroke="#7a9b6d" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M400,210 Q405,225 445,235" fill="none" stroke="#7a9b6d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arms -->
  <path d="M355,235 L335,310 L325,350" fill="none" stroke="#7a9b6d" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M445,235 L465,310 L475,350" fill="none" stroke="#7a9b6d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Torso -->
  <path d="M375,225 L370,370" fill="none" stroke="#7a9b6d" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M425,225 L430,370" fill="none" stroke="#7a9b6d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Hips -->
  <path d="M370,370 Q400,385 430,370" fill="none" stroke="#7a9b6d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Legs -->
  <path d="M380,378 L370,460 L365,530" fill="none" stroke="#7a9b6d" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M420,378 L430,460 L435,530" fill="none" stroke="#7a9b6d" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Body glow - balanced energy -->
  <ellipse cx="400" cy="300" rx="50" ry="80" fill="#a3c490" opacity="0.08"/>

  <!-- Shield icon - Immune System (left side) -->
  <path d="M180,220 L180,280 Q180,320 220,340 Q260,320 260,280 L260,220 Q220,200 180,220Z" fill="url(#shield-fill)" stroke="#7a9b6d" stroke-width="2"/>
  <!-- Check mark inside shield -->
  <path d="M205,275 L218,290 L245,255" fill="none" stroke="#7a9b6d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Shield label dots -->
  <circle cx="220" cy="205" r="2" fill="#7a9b6d" opacity="0.4"/>

  <!-- Connection line from shield to body -->
  <path d="M260,280 Q310,270 365,270" fill="none" stroke="#a3c490" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Stomach/Digestion icon (right side) -->
  <ellipse cx="590" cy="280" rx="40" ry="45" fill="#8bb0c4" opacity="0.12" stroke="#8bb0c4" stroke-width="1.5"/>
  <!-- Stomach shape -->
  <path d="M570,255 Q565,265 570,285 Q575,310 595,315 Q615,310 615,290 Q618,270 610,260 Q600,250 585,252 Q575,253 570,255Z" fill="none" stroke="#7aa0b4" stroke-width="2" opacity="0.7"/>
  <!-- Digestion swirl inside -->
  <path d="M582,275 Q590,268 598,275 Q602,285 595,292 Q588,295 585,290" fill="none" stroke="#8bb0c4" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Small dots - nutrients -->
  <circle cx="585" cy="280" r="2" fill="#8bb0c4" opacity="0.5"/>
  <circle cx="595" cy="285" r="1.5" fill="#8bb0c4" opacity="0.4"/>
  <circle cx="590" cy="270" r="1.5" fill="#8bb0c4" opacity="0.4"/>

  <!-- Connection line from stomach to body -->
  <path d="M550,280 Q490,280 435,290" fill="none" stroke="#8bb0c4" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Sun/Energy icon (top) -->
  <circle cx="400" cy="70" r="22" fill="#d4b896" opacity="0.2" stroke="#d4b896" stroke-width="1.5"/>
  <circle cx="400" cy="70" r="14" fill="#d4b896" opacity="0.25"/>
  <!-- Sun rays -->
  <line x1="400" y1="42" x2="400" y2="34" stroke="#d4b896" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="400" y1="98" x2="400" y2="106" stroke="#d4b896" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="372" y1="70" x2="364" y2="70" stroke="#d4b896" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="428" y1="70" x2="436" y2="70" stroke="#d4b896" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="382" y1="52" x2="376" y2="46" stroke="#d4b896" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <line x1="418" y1="52" x2="424" y2="46" stroke="#d4b896" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <line x1="382" y1="88" x2="376" y2="94" stroke="#d4b896" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <line x1="418" y1="88" x2="424" y2="94" stroke="#d4b896" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>

  <!-- Connection from sun to body -->
  <path d="M400,92 Q400,115 400,145" fill="none" stroke="#d4b896" stroke-width="1" stroke-dasharray="4,4" opacity="0.35"/>

  <!-- Energy circles around body -->
  <circle cx="400" cy="290" r="60" fill="none" stroke="#a3c490" stroke-width="1" opacity="0.2"/>
  <circle cx="400" cy="290" r="80" fill="none" stroke="#a3c490" stroke-width="0.8" opacity="0.15"/>
  <circle cx="400" cy="290" r="100" fill="none" stroke="#8bb0c4" stroke-width="0.8" opacity="0.1"/>

  <!-- Meridian points on body -->
  <circle cx="400" cy="230" r="3.5" fill="#7a9b6d" opacity="0.45"/>
  <circle cx="400" cy="260" r="3.5" fill="#7a9b6d" opacity="0.45"/>
  <circle cx="400" cy="290" r="4" fill="#7a9b6d" opacity="0.5"/>
  <circle cx="400" cy="320" r="3.5" fill="#7a9b6d" opacity="0.45"/>
  <circle cx="400" cy="350" r="3.5" fill="#7a9b6d" opacity="0.45"/>

  <!-- Decorative leaf accents -->
  <path d="M130,380 Q148,365 162,378 Q148,390 130,380Z" fill="#a3c490" opacity="0.3"/>
  <path d="M640,160 Q658,148 672,160 Q658,172 640,160Z" fill="#a3c490" opacity="0.25"/>
  <path d="M100,280 Q115,268 128,280 Q115,290 100,280Z" fill="#8bab78" opacity="0.2"/>

  <!-- Small floating dots -->
  <circle cx="300" cy="180" r="2" fill="#a3c490" opacity="0.3"/>
  <circle cx="500" cy="190" r="2" fill="#8bb0c4" opacity="0.3"/>
  <circle cx="280" cy="350" r="1.5" fill="#a3c490" opacity="0.25"/>
  <circle cx="520" cy="380" r="1.5" fill="#8bb0c4" opacity="0.25"/>
  <circle cx="300" cy="450" r="2" fill="#d4b896" opacity="0.25"/>
  <circle cx="500" cy="430" r="2" fill="#a3c490" opacity="0.25"/>

  <!-- Bottom decorative wave -->
  <path d="M150,520 Q250,500 350,515 Q450,530 550,510 Q650,495 720,520" fill="none" stroke="#a3c490" stroke-width="1.2" opacity="0.2"/>
</svg>