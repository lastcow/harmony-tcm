<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg-sc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eaede8"/>
      <stop offset="100%" style="stop-color:#e5f0e5"/>
    </linearGradient>
    <linearGradient id="lung-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a3c490;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#8bab78;stop-opacity:0.15"/>
    </linearGradient>
    <linearGradient id="grey-to-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a0a0a0;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#8bab78;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7a9b6d;stop-opacity:0.4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="20" y="20" width="760" height="560" rx="30" ry="30" fill="url(#bg-sc)"/>

  <!-- Transition gradient bar at top - grey to green -->
  <rect x="200" y="50" width="400" height="6" rx="3" fill="url(#grey-to-green)" opacity="0.5"/>

  <!-- Decorative circles -->
  <circle cx="650" cy="130" r="45" fill="#a3c490" opacity="0.08"/>
  <circle cx="150" cy="450" r="50" fill="#8bab78" opacity="0.06"/>

  <!-- Broken cigarette - left/grey side -->
  <!-- First half -->
  <rect x="180" y="245" width="80" height="16" rx="3" fill="#c8c0b8" opacity="0.5" transform="rotate(-10 220 253)"/>
  <rect x="250" y="241" width="15" height="16" rx="2" fill="#d4a060" opacity="0.35" transform="rotate(-10 257 249)"/>

  <!-- Break point - jagged -->
  <path d="M265,238 L270,248 L265,253 L272,258" fill="none" stroke="#b0a090" stroke-width="1.5" opacity="0.4"/>

  <!-- Second half - falling/tilted -->
  <rect x="275" y="268" width="80" height="16" rx="3" fill="#c8c0b8" opacity="0.4" transform="rotate(25 315 276)"/>
  <rect x="345" y="284" width="15" height="16" rx="2" fill="#d4a060" opacity="0.3" transform="rotate(25 352 292)"/>

  <!-- Smoke wisps dissipating (grey, fading) -->
  <path d="M230,230 Q235,210 225,195 Q220,180 228,165" fill="none" stroke="#b0b0b0" stroke-width="1.5" stroke-linecap="round" opacity="0.15"/>
  <path d="M245,225 Q252,205 242,188 Q238,172 245,155" fill="none" stroke="#b0b0b0" stroke-width="1.2" stroke-linecap="round" opacity="0.12"/>
  <path d="M215,235 Q210,218 218,200 Q215,185 220,170" fill="none" stroke="#b0b0b0" stroke-width="1" stroke-linecap="round" opacity="0.1"/>

  <!-- X mark over cigarette -->
  <line x1="200" y1="220" x2="340" y2="300" stroke="#c47a6a" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="340" y1="220" x2="200" y2="300" stroke="#c47a6a" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Healing lungs - right/green side -->
  <!-- Left lung -->
  <path d="M480,240 Q460,250 455,290 Q450,340 470,370 Q490,390 510,380 Q525,370 520,330 Q518,280 500,250 Q495,240 480,240Z" fill="url(#lung-fill)" stroke="#7a9b6d" stroke-width="1.8" opacity="0.8"/>

  <!-- Right lung -->
  <path d="M540,240 Q555,250 560,290 Q565,340 545,370 Q525,390 510,380 Q500,370 505,330 Q505,280 520,250 Q525,240 540,240Z" fill="url(#lung-fill)" stroke="#7a9b6d" stroke-width="1.8" opacity="0.8"/>

  <!-- Trachea/bronchi -->
  <line x1="510" y1="200" x2="510" y2="260" stroke="#7a9b6d" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M510,260 Q500,270 490,285" fill="none" stroke="#7a9b6d" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M510,260 Q520,270 530,285" fill="none" stroke="#7a9b6d" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Bronchiole branches -->
  <path d="M490,285 Q482,295 478,310" fill="none" stroke="#8bab78" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
  <path d="M490,285 Q495,298 498,315" fill="none" stroke="#8bab78" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
  <path d="M530,285 Q538,295 542,310" fill="none" stroke="#8bab78" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
  <path d="M530,285 Q525,298 522,315" fill="none" stroke="#8bab78" stroke-width="1" stroke-linecap="round" opacity="0.35"/>

  <!-- Healthy glow around lungs -->
  <ellipse cx="510" cy="310" rx="65" ry="75" fill="#a3c490" opacity="0.06"/>
  <ellipse cx="510" cy="310" rx="80" ry="90" fill="#a3c490" opacity="0.04"/>

  <!-- Fresh air flow lines into lungs -->
  <path d="M510,160 Q515,170 510,180 Q505,190 510,200" fill="none" stroke="#8bb0c4" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M495,165 Q500,175 495,185 Q490,195 495,205" fill="none" stroke="#8bb0c4" stroke-width="1.2" stroke-linecap="round" opacity="0.25"/>
  <path d="M525,165 Q530,175 525,185 Q520,195 525,205" fill="none" stroke="#8bb0c4" stroke-width="1.2" stroke-linecap="round" opacity="0.25"/>

  <!-- Nature/fresh elements -->
  <!-- Leaves around lungs -->
  <path d="M430,350 Q445,335 458,348 Q445,360 430,350Z" fill="#a3c490" opacity="0.35"/>
  <path d="M565,345 Q578,332 590,345 Q578,358 565,345Z" fill="#a3c490" opacity="0.3"/>
  <path d="M440,230 Q452,218 462,232 Q450,240 440,230Z" fill="#8bab78" opacity="0.25"/>
  <path d="M560,225 Q572,215 580,228 Q570,236 560,225Z" fill="#8bab78" opacity="0.25"/>

  <!-- Small flowers -->
  <circle cx="450" cy="400" r="6" fill="#a3c490" opacity="0.2"/>
  <circle cx="450" cy="400" r="3" fill="#8bab78" opacity="0.3"/>
  <circle cx="570" cy="395" r="5" fill="#a3c490" opacity="0.2"/>
  <circle cx="570" cy="395" r="2.5" fill="#8bab78" opacity="0.3"/>

  <!-- Transition arrow from grey to green -->
  <path d="M350,310 Q390,300 420,290" fill="none" stroke="#7a9b6d" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M412,285 L420,290 L413,296" fill="none" stroke="#7a9b6d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>

  <!-- Chain breaking symbol -->
  <!-- Chain links -->
  <ellipse cx="180" cy="400" rx="15" ry="10" fill="none" stroke="#a0a0a0" stroke-width="2" opacity="0.3"/>
  <ellipse cx="205" cy="400" rx="15" ry="10" fill="none" stroke="#a0a0a0" stroke-width="2" opacity="0.3"/>
  <!-- Break -->
  <line x1="220" y1="395" x2="230" y2="390" stroke="#a0a0a0" stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>
  <line x1="230" y1="405" x2="240" y2="410" stroke="#a0a0a0" stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>
  <!-- Break flash -->
  <line x1="225" y1="388" x2="228" y2="382" stroke="#d4a060" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
  <line x1="235" y1="412" x2="238" y2="418" stroke="#d4a060" stroke-width="1" stroke-linecap="round" opacity="0.3"/>

  <!-- Bottom nature scene -->
  <path d="M400,500 Q420,480 430,490 Q440,478 450,488 Q460,476 475,490" fill="none" stroke="#a3c490" stroke-width="1.5" opacity="0.25"/>
  <path d="M350,510 Q370,492 385,505 Q395,490 410,502" fill="none" stroke="#8bab78" stroke-width="1.2" opacity="0.2"/>

  <!-- Floating dots transitioning from grey to green -->
  <circle cx="300" cy="150" r="3" fill="#b0b0b0" opacity="0.2"/>
  <circle cx="380" cy="130" r="2.5" fill="#90a890" opacity="0.2"/>
  <circle cx="460" cy="120" r="3" fill="#a3c490" opacity="0.25"/>
  <circle cx="540" cy="130" r="2.5" fill="#8bab78" opacity="0.25"/>
  <circle cx="620" cy="140" r="2" fill="#7a9b6d" opacity="0.25"/>

  <!-- Fresh breeze lines -->
  <path d="M580,160 Q610,155 640,165" fill="none" stroke="#8bb0c4" stroke-width="1" stroke-linecap="round" opacity="0.2"/>
  <path d="M590,175 Q615,170 635,180" fill="none" stroke="#8bb0c4" stroke-width="0.8" stroke-linecap="round" opacity="0.15"/>
</svg>