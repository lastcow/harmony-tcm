<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg-cp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f5f0"/>
      <stop offset="100%" style="stop-color:#e8f0e8"/>
    </linearGradient>
    <linearGradient id="pain-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8a0a0;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#d4897a;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="20" y="20" width="760" height="560" rx="30" ry="30" fill="url(#bg-cp)"/>

  <!-- Decorative circles -->
  <circle cx="680" cy="100" r="60" fill="#b8c9a3" opacity="0.15"/>
  <circle cx="120" cy="480" r="45" fill="#b8c9a3" opacity="0.12"/>
  <circle cx="700" cy="450" r="35" fill="#d4a98a" opacity="0.1"/>

  <!-- Human figure outline -->
  <!-- Head -->
  <circle cx="400" cy="130" r="38" fill="none" stroke="#7a9b6d" stroke-width="2.5" opacity="0.8"/>
  <!-- Neck -->
  <line x1="400" y1="168" x2="400" y2="195" stroke="#7a9b6d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Shoulders -->
  <path d="M400,195 Q400,210 350,220" fill="none" stroke="#7a9b6d" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M400,195 Q400,210 450,220" fill="none" stroke="#7a9b6d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arms -->
  <path d="M350,220 L320,300 L310,360" fill="none" stroke="#7a9b6d" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M450,220 L480,300 L490,360" fill="none" stroke="#7a9b6d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Torso -->
  <path d="M370,210 L365,340" fill="none" stroke="#7a9b6d" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M430,210 L435,340" fill="none" stroke="#7a9b6d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Hips -->
  <path d="M365,340 Q400,360 435,340" fill="none" stroke="#7a9b6d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Legs -->
  <path d="M375,350 L360,440 L355,520" fill="none" stroke="#7a9b6d" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M425,350 L440,440 L445,520" fill="none" stroke="#7a9b6d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Spine -->
  <path d="M400,195 L400,345" fill="none" stroke="#7a9b6d" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- Pain areas - lower back -->
  <ellipse cx="400" cy="310" rx="35" ry="25" fill="url(#pain-glow)" opacity="0.7"/>
  <ellipse cx="400" cy="310" rx="25" ry="18" fill="#d4897a" opacity="0.3"/>
  <ellipse cx="400" cy="310" rx="15" ry="10" fill="#c97a6a" opacity="0.25"/>

  <!-- Pain area - right knee -->
  <ellipse cx="440" cy="440" rx="22" ry="20" fill="url(#pain-glow)" opacity="0.6"/>
  <ellipse cx="440" cy="440" rx="14" ry="12" fill="#d4897a" opacity="0.3"/>

  <!-- Pain area - left shoulder -->
  <ellipse cx="345" cy="220" rx="20" ry="18" fill="url(#pain-glow)" opacity="0.6"/>
  <ellipse cx="345" cy="220" rx="12" ry="10" fill="#d4897a" opacity="0.3"/>

  <!-- Acupuncture needles - back area -->
  <line x1="370" y1="290" x2="390" y2="305" stroke="#8bab78" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="368" cy="288" r="2.5" fill="#7a9b6d"/>
  <line x1="430" y1="295" x2="415" y2="308" stroke="#8bab78" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="432" cy="293" r="2.5" fill="#7a9b6d"/>
  <line x1="400" y1="280" x2="400" y2="300" stroke="#8bab78" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="400" cy="278" r="2.5" fill="#7a9b6d"/>

  <!-- Acupuncture needle - knee -->
  <line x1="460" y1="425" x2="448" y2="438" stroke="#8bab78" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="462" cy="423" r="2.5" fill="#7a9b6d"/>

  <!-- Acupuncture needle - shoulder -->
  <line x1="325" y1="208" x2="340" y2="218" stroke="#8bab78" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="323" cy="206" r="2.5" fill="#7a9b6d"/>

  <!-- Healing energy waves - left side -->
  <path d="M240,250 Q230,280 240,310" fill="none" stroke="#a3c490" stroke-width="1.5" opacity="0.5"/>
  <path d="M225,245 Q212,280 225,315" fill="none" stroke="#a3c490" stroke-width="1.5" opacity="0.4"/>
  <path d="M210,240 Q195,280 210,320" fill="none" stroke="#a3c490" stroke-width="1.5" opacity="0.3"/>

  <!-- Healing energy waves - right side -->
  <path d="M560,250 Q570,280 560,310" fill="none" stroke="#a3c490" stroke-width="1.5" opacity="0.5"/>
  <path d="M575,245 Q588,280 575,315" fill="none" stroke="#a3c490" stroke-width="1.5" opacity="0.4"/>
  <path d="M590,240 Q605,280 590,320" fill="none" stroke="#a3c490" stroke-width="1.5" opacity="0.3"/>

  <!-- Healing energy dots -->
  <circle cx="200" cy="260" r="3" fill="#a3c490" opacity="0.5"/>
  <circle cx="195" cy="290" r="2.5" fill="#a3c490" opacity="0.4"/>
  <circle cx="205" cy="305" r="2" fill="#a3c490" opacity="0.35"/>
  <circle cx="600" cy="255" r="3" fill="#a3c490" opacity="0.5"/>
  <circle cx="605" cy="285" r="2.5" fill="#a3c490" opacity="0.4"/>
  <circle cx="595" cy="310" r="2" fill="#a3c490" opacity="0.35"/>

  <!-- Top healing energy arcs -->
  <path d="M340,90 Q400,60 460,90" fill="none" stroke="#b8c9a3" stroke-width="1.5" opacity="0.4"/>
  <path d="M330,75 Q400,40 470,75" fill="none" stroke="#b8c9a3" stroke-width="1.5" opacity="0.3"/>

  <!-- Small leaf accents -->
  <path d="M150,150 Q165,135 180,145 Q165,155 150,150Z" fill="#a3c490" opacity="0.4"/>
  <path d="M620,480 Q635,465 650,475 Q635,485 620,480Z" fill="#a3c490" opacity="0.35"/>
  <path d="M160,400 Q172,388 184,396 Q172,404 160,400Z" fill="#8bab78" opacity="0.3"/>

  <!-- Meridian points along body -->
  <circle cx="400" cy="250" r="4" fill="#7a9b6d" opacity="0.5"/>
  <circle cx="400" cy="270" r="4" fill="#7a9b6d" opacity="0.5"/>
  <circle cx="400" cy="330" r="4" fill="#7a9b6d" opacity="0.5"/>
  <circle cx="365" cy="280" r="3" fill="#7a9b6d" opacity="0.4"/>
  <circle cx="435" cy="280" r="3" fill="#7a9b6d" opacity="0.4"/>
</svg>